    <!-- Google AdSense -->
    <!-- Google AdSense (Loads only in browsers, not in Apps) -->
    <script>
      (function() {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var isWebView = /(wv|Version\/[\d\.]+.*Chrome\/[0-9]{2,}\.)/i.test(userAgent) || (userAgent.indexOf('Android') > -1 && userAgent.indexOf('wv') > -1) || /(iPhone|iPod|iPad).*AppleWebKit(?!.*Safari)/i.test(userAgent);
        
        // Prevent AdSense from loading inside the Android App (WebView) to protect account
        if (!isWebView) {
          var script = document.createElement('script');
          script.async = true;
          script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1052173421990358";
          script.crossOrigin = "anonymous";
          document.head.appendChild(script);
        } else {
          console.log("App WebView detected. AdSense blocked.");
        }
      })();
    </script>
